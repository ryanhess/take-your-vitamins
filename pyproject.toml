[project]
name = "vitapp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "honcho>=2.0.0",
    "sqlalchemy>=2.0.46",
    "alembic>=1.18.4",
    "psycopg>=3.3.2",
    "greenlet>=3.3.1",
    "pydantic-settings>=2.13.0",
    "python-dotenv>=1.2.1",
]

[dependency-groups]
dev = [
    "fastapi>=0.135.3",
    "uvicorn>=0.44.0",
    "httpx>=0.28.1",
    "marimo>=0.23.0",
    "pandas>=3.0.2",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"